
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Manhwa Library</title>

  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Manhwa Library">

  <link rel="manifest" href="./manifest.json">

  <!-- iPhone Home Screen icon -->
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">

  <!-- Android / PWA icons -->
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",
        "Helvetica Neue", Arial, sans-serif;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .app {
      min-height: 100vh;
      background: #000;
    }

    header {
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-bottom: 1px solid #1c1c1c;
      position: sticky;
      top: 0;
      z-index: 20;
      background: #000;
    }

    .logo {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .add-button {
      width: 34px;
      height: 34px;
      border: 1px solid #333;
      border-radius: 50%;
      background: #111;
      color: #fff;
      font-size: 24px;
      line-height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .content {
      padding: 16px;
      max-width: 900px;
      margin: 0 auto;
    }

    .search {
      width: 100%;
      height: 42px;
      background: #111;
      border: 1px solid #222;
      border-radius: 10px;
      color: #fff;
      padding: 0 14px;
      outline: none;
      margin-bottom: 18px;
    }

    .search::placeholder {
      color: #777;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 17px;
      font-weight: 700;
    }

    .organize-button {
      background: transparent;
      border: 0;
      color: #aaa;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      padding: 5px 0;
    }

    .organize-menu {
      display: none;
      background: #111;
      border: 1px solid #292929;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 14px;
    }

    .organize-menu button {
      width: 100%;
      padding: 13px 14px;
      text-align: left;
      background: #111;
      color: #fff;
      border: 0;
      border-bottom: 1px solid #222;
      cursor: pointer;
      font-size: 14px;
    }

    .organize-menu button:last-child {
      border-bottom: 0;
    }

    .organize-menu button:active {
      background: #222;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 9px;
    }

    .card {
      cursor: pointer;
      min-width: 0;
    }

    .cover {
      width: 100%;
      aspect-ratio: 0.68;
      object-fit: cover;
      display: block;
      background: #111;
      border-radius: 0;
    }

    .card-name {
      display: none;
    }

    .list-view {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .list-view .card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #111;
      padding: 8px;
      border-radius: 8px;
    }

    .list-view .cover {
      width: 58px;
      height: 78px;
      aspect-ratio: auto;
      flex-shrink: 0;
    }

    .list-view .card-name {
      display: block;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.3;
    }

    .list-view .card-chapters {
      display: block;
      color: #888;
      font-size: 12px;
      margin-top: 5px;
    }

    .card-chapters {
      display: none;
    }

    .empty {
      color: #666;
      text-align: center;
      padding: 50px 10px;
      font-size: 14px;
    }

    .screen {
      display: none;
      min-height: calc(100vh - 58px);
    }

    .screen.active {
      display: block;
    }

    .back-button {
      background: transparent;
      border: 0;
      color: #fff;
      font-size: 15px;
      padding: 0;
      cursor: pointer;
    }

    .detail {
      padding: 24px 16px 40px;
      max-width: 600px;
      margin: 0 auto;
    }

    .detail-cover {
      width: 180px;
      height: 265px;
      object-fit: cover;
      display: block;
      margin: 0 auto 22px;
    }

    .detail-title {
      font-size: 25px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 22px;
      line-height: 1.15;
    }

    .detail-info {
      background: #111;
      border: 1px solid #222;
      border-radius: 12px;
      overflow: hidden;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      padding: 15px;
      border-bottom: 1px solid #222;
      font-size: 14px;
    }

    .info-row:last-child {
      border-bottom: 0;
    }

    .info-label {
      color: #777;
    }

    .info-value {
      color: #fff;
      text-align: right;
    }

    .detail-actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    .action-button {
      flex: 1;
      height: 44px;
      border-radius: 9px;
      border: 1px solid #333;
      background: #111;
      color: #fff;
      cursor: pointer;
    }

    .action-button.delete {
      color: #aaa;
    }

    .modal-background {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      z-index: 100;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-background.active {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 600px;
      background: #111;
      border: 1px solid #292929;
      border-bottom: 0;
      border-radius: 18px 18px 0 0;
      padding: 20px 16px 28px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-title {
      font-size: 19px;
      font-weight: 700;
      margin-bottom: 18px;
    }

    .field {
      margin-bottom: 15px;
    }

    .field label {
      display: block;
      color: #999;
      font-size: 12px;
      margin-bottom: 7px;
    }

    .field input,
    .field select {
      width: 100%;
      height: 43px;
      background: #000;
      border: 1px solid #333;
      border-radius: 8px;
      color: #fff;
      padding: 0 12px;
      outline: none;
    }

    .cover-preview {
      width: 90px;
      height: 130px;
      object-fit: cover;
      display: none;
      margin-top: 10px;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .modal-actions button {
      flex: 1;
      height: 44px;
      border-radius: 9px;
      border: 1px solid #333;
      background: #000;
      color: #fff;
      cursor: pointer;
    }

    .stats {
      display: none;
      padding: 20px 0 40px;
    }

    .stats.active {
      display: block;
    }

    .stat-box {
      background: #111;
      border: 1px solid #222;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 12px;
    }

    .stat-number {
      font-size: 28px;
      font-weight: 700;
    }

    .stat-label {
      color: #777;
      font-size: 12px;
      margin-top: 4px;
    }

    .chart {
      margin-top: 20px;
    }

    .chart-row {
      margin-bottom: 14px;
    }

    .chart-name {
      font-size: 12px;
      margin-bottom: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bar-background {
      height: 8px;
      background: #222;
      border-radius: 4px;
      overflow: hidden;
    }

    .bar {
      height: 100%;
      background: #fff;
      border-radius: 4px;
    }

    @media (min-width: 700px) {
      .content {
        padding: 22px;
      }

      .grid {
        gap: 12px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <div class="logo">Manhwa Library</div>

    <button class="add-button" onclick="abrirModal()">
      +
    </button>
  </header>

  <!-- HOME -->
  <div id="homeScreen" class="screen active">

    <main class="content">

      <input
        id="searchInput"
        class="search"
        type="search"
        placeholder="Search manhwa..."
        oninput="renderizar()"
      >

      <div class="section-header">
        <div class="section-title">Started</div>

        <button
          class="organize-button"
          onclick="alternarOrganizar()"
        >
          ORGANIZE
        </button>
      </div>

      <div id="organizeMenu" class="organize-menu">

        <button onclick="ordenarAlfabeticamente()">
          Alphabetical order
        </button>

        <button onclick="ordenarRecentemente()">
          Recently added
        </button>

        <button onclick="mudarVisualizacao('grid')">
          Grid view
        </button>

        <button onclick="mudarVisualizacao('list')">
          List view
        </button>

        <button onclick="mostrarEstatisticas()">
          Statistics
        </button>

      </div>

      <div id="library" class="grid"></div>

      <div id="empty" class="empty">
        No manhwa added yet.
      </div>

    </main>

  </div>

  <!-- DETAIL -->
  <div id="detailScreen" class="screen">

    <header>
      <button class="back-button" onclick="voltarHome()">
        Back
      </button>
    </header>

    <main class="detail">

      <img
        id="detailCover"
        class="detail-cover"
        src=""
        alt=""
      >

      <div id="detailTitle" class="detail-title"></div>

      <div class="detail-info">

        <div class="info-row">
          <span class="info-label">Chapters read</span>
          <span id="detailChapters" class="info-value"></span>
        </div>

        <div class="info-row">
          <span class="info-label">Status</span>
          <span id="detailStatus" class="info-value"></span>
        </div>

      </div>

      <div class="detail-actions">

        <button
          class="action-button"
          onclick="editarAtual()"
        >
          Edit
        </button>

        <button
          class="action-button delete"
          onclick="excluirAtual()"
        >
          Delete
        </button>

      </div>

    </main>

  </div>

  <!-- STATISTICS -->
  <div id="statsScreen" class="screen">

    <header>
      <button class="back-button" onclick="voltarHome()">
        Back
      </button>
    </header>

    <main class="content">

      <div class="section-title">
        Statistics
      </div>

      <div class="stats active">

        <div class="stat-box">
          <div id="totalChapters" class="stat-number">0</div>
          <div class="stat-label">Total chapters read</div>
        </div>

        <div class="stat-box">
          <div id="totalManhwas" class="stat-number">0</div>
          <div class="stat-label">Total manhwas</div>
        </div>

        <div id="chart" class="chart"></div>

      </div>

    </main>

  </div>

</div>

<!-- MODAL -->
<div id="modalBackground" class="modal-background">

  <div class="modal">

    <div id="modalTitle" class="modal-title">
      Add Manhwa
    </div>

    <div class="field">

      <label>Name</label>

      <input
        id="nameInput"
        type="text"
        autocomplete="off"
      >

    </div>

    <div class="field">

      <label>Chapters read</label>

      <input
        id="chaptersInput"
        type="number"
        min="0"
        inputmode="numeric"
      >

    </div>

    <div class="field">

      <label>Status</label>

      <select id="statusInput">

        <option value="Reading">
          Reading
        </option>

        <option value="Paused">
          Paused
        </option>

        <option value="Completed">
          Completed
        </option>

        <option value="Dropped">
          Dropped
        </option>

      </select>

    </div>

    <div class="field">

      <label>Cover</label>

      <input
        id="coverInput"
        type="file"
        accept="image/*"
        onchange="mostrarPreview()"
      >

      <img
        id="coverPreview"
        class="cover-preview"
        src=""
        alt=""
      >

    </div>

    <div class="modal-actions">

      <button onclick="fecharModal()">
        Cancel
      </button>

      <button onclick="salvarManhwa()">
        Save
      </button>

    </div>

  </div>

</div>

<script>

  let manhwas = JSON.parse(
    localStorage.getItem("manhwas") || "[]"
  );

  let ordemManhwas =
    localStorage.getItem("ordemManhwas") || "original";

  let visualizacaoManhwas =
    localStorage.getItem("visualizacaoManhwas") || "grid";

  let manhwaAtual = null;
  let indiceEdicao = null;

  function salvarDados() {

    localStorage.setItem(
      "manhwas",
      JSON.stringify(manhwas)
    );

    localStorage.setItem(
      "ordemManhwas",
      ordemManhwas
    );

    localStorage.setItem(
      "visualizacaoManhwas",
      visualizacaoManhwas
    );
  }

  function renderizar() {

    const library =
      document.getElementById("library");

    const empty =
      document.getElementById("empty");

    const busca =
      document.getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();

    let lista = [...manhwas];

    if (ordemManhwas === "alphabetical") {

      lista.sort((a, b) =>
        a.nome.localeCompare(
          b.nome,
          undefined,
          { sensitivity: "base" }
        )
      );

    } else if (ordemManhwas === "recent") {

      lista.reverse();

    }

    if (busca) {

      lista = lista.filter(m =>
        m.nome
          .toLowerCase()
          .includes(busca)
      );

    }

    library.innerHTML = "";

    if (lista.length === 0) {

      empty.style.display = "block";

    } else {

      empty.style.display = "none";

      lista.forEach((m) => {

        const index =
          manhwas.indexOf(m);

        const card =
          document.createElement("div");

        card.className = "card";

        card.onclick = function() {
          abrirDetalhes(index);
        };

        const img =
          document.createElement("img");

        img.className = "cover";

        img.src = m.capa || "";

        img.alt = m.nome;

        const name =
          document.createElement("div");

        name.className = "card-name";

        name.textContent = m.nome;

        const chapters =
          document.createElement("div");

        chapters.className = "card-chapters";

        chapters.textContent =
          m.capitulos + " chapters";

        card.appendChild(img);
        card.appendChild(name);
        card.appendChild(chapters);

        library.appendChild(card);

      });

    }

    if (visualizacaoManhwas === "list") {

      library.classList.remove("grid");
      library.classList.add("list-view");

    } else {

      library.classList.remove("list-view");
      library.classList.add("grid");

    }

  }

  function alternarOrganizar() {

    const menu =
      document.getElementById("organizeMenu");

    menu.style.display =
      menu.style.display === "block"
        ? "none"
        : "block";

  }

  function ordenarAlfabeticamente() {

    ordemManhwas = "alphabetical";

    salvarDados();
    renderizar();

  }

  function ordenarRecentemente() {

    ordemManhwas = "recent";

    salvarDados();
    renderizar();

  }

  function mudarVisualizacao(tipo) {

    visualizacaoManhwas = tipo;

    salvarDados();
    renderizar();

  }

  function abrirModal(indice = null) {

    indiceEdicao = indice;

    const modal =
      document.getElementById("modalBackground");

    const title =
      document.getElementById("modalTitle");

    const nameInput =
      document.getElementById("nameInput");

    const chaptersInput =
      document.getElementById("chaptersInput");

    const statusInput =
      document.getElementById("statusInput");

    const preview =
      document.getElementById("coverPreview");

    if (indice !== null) {

      const m = manhwas[indice];

      title.textContent = "Edit Manhwa";

      nameInput.value = m.nome;

      chaptersInput.value = m.capitulos;

      statusInput.value = m.status;

      if (m.capa) {

        preview.src = m.capa;

        preview.style.display = "block";

      } else {

        preview.style.display = "none";

      }

    } else {

      title.textContent = "Add Manhwa";

      nameInput.value = "";

      chaptersInput.value = 0;

      statusInput.value = "Reading";

      preview.src = "";

      preview.style.display = "none";

    }

    modal.classList.add("active");

  }

  function fecharModal() {

    document
      .getElementById("modalBackground")
      .classList.remove("active");

    document
      .getElementById("coverInput")
      .value = "";

    indiceEdicao = null;

  }

  function mostrarPreview() {

    const input =
      document.getElementById("coverInput");

    const preview =
      document.getElementById("coverPreview");

    if (!input.files || !input.files[0]) {
      return;
    }

    const reader =
      new FileReader();

    reader.onload = function(e) {

      preview.src = e.target.result;

      preview.style.display = "block";

    };

    reader.readAsDataURL(
      input.files[0]
    );

  }

  function salvarManhwa() {

    const nome =
      document
        .getElementById("nameInput")
        .value
        .trim();

    const capitulos =
      Number(
        document
          .getElementById("chaptersInput")
          .value || 0
      );

    const status =
      document
        .getElementById("statusInput")
        .value;

    const coverInput =
      document.getElementById("coverInput");

    if (!nome) {

      alert("Enter the manhwa name.");

      return;

    }

    function finalizar(capa) {

      const novoManhwa = {
        nome: nome,
        capitulos: capitulos,
        status: status,
        capa: capa
      };

      if (indiceEdicao !== null) {

        manhwas[indiceEdicao] =
          novoManhwa;

      } else {

        manhwas.push(
          novoManhwa
        );

      }

      salvarDados();

      fecharModal();

      renderizar();

    }

    if (
      coverInput.files &&
      coverInput.files[0]
    ) {

      const reader =
        new FileReader();

      reader.onload = function(e) {

        finalizar(
          e.target.result
        );

      };

      reader.readAsDataURL(
        coverInput.files[0]
      );

    } else if (
      indiceEdicao !== null
    ) {

      finalizar(
        manhwas[indiceEdicao].capa || ""
      );

    } else {

      finalizar("");

    }

  }

  function abrirDetalhes(indice) {

    manhwaAtual = indice;

    const m =
      manhwas[indice];

    document
      .getElementById("detailCover")
      .src = m.capa || "";

    document
      .getElementById("detailTitle")
      .textContent = m.nome;

    document
      .getElementById("detailChapters")
      .textContent = m.capitulos;

    document
      .getElementById("detailStatus")
      .textContent = m.status;

    document
      .getElementById("homeScreen")
      .classList.remove("active");

    document
      .getElementById("statsScreen")
      .classList.remove("active");

    document
      .getElementById("detailScreen")
      .classList.add("active");

    window.scrollTo(0, 0);

  }

  function voltarHome() {

    document
      .getElementById("detailScreen")
      .classList.remove("active");

    document
      .getElementById("statsScreen")
      .classList.remove("active");

    document
      .getElementById("homeScreen")
      .classList.add("active");

    renderizar();

  }

  function editarAtual() {

    if (manhwaAtual === null) {
      return;
    }

    abrirModal(
      manhwaAtual
    );

  }

  function excluirAtual() {

    if (manhwaAtual === null) {
      return;
    }

    const confirmar =
      confirm(
        "Delete this manhwa?"
      );

    if (!confirmar) {
      return;
    }

    manhwas.splice(
      manhwaAtual,
      1
    );

    salvarDados();

    manhwaAtual = null;

    voltarHome();

  }

  function mostrarEstatisticas() {

    document
      .getElementById("organizeMenu")
      .style.display = "none";

    const total =
      manhwas.reduce(
        (soma, m) =>
          soma + Number(m.capitulos || 0),
        0
      );

    document
      .getElementById("totalChapters")
      .textContent = total;

    document
      .getElementById("totalManhwas")
      .textContent =
        manhwas.length;

    const chart =
      document.getElementById("chart");

    chart.innerHTML = "";

    const maior =
      Math.max(
        ...manhwas.map(
          m => Number(m.capitulos || 0)
        ),
        1
      );

    manhwas.forEach(m => {

      const row =
        document.createElement("div");

      row.className =
        "chart-row";

      const name =
        document.createElement("div");

      name.className =
        "chart-name";

      name.textContent =
        m.nome;

      const background =
        document.createElement("div");

      background.className =
        "bar-background";

      const bar =
        document.createElement("div");

      bar.className =
        "bar";

      bar.style.width =
        (
          Number(m.capitulos || 0)
          / maior
          * 100
        ) + "%";

      background.appendChild(bar);

      row.appendChild(name);
      row.appendChild(background);

      chart.appendChild(row);

    });

    document
      .getElementById("homeScreen")
      .classList.remove("active");

    document
      .getElementById("detailScreen")
      .classList.remove("active");

    document
      .getElementById("statsScreen")
      .classList.add("active");

    window.scrollTo(0, 0);

  }

  renderizar();

  if ("serviceWorker" in navigator) {

    window.addEventListener(
      "load",
      function() {

        navigator.serviceWorker
          .register(
            "./service-worker.js"
          )
          .then(function() {

            console.log(
              "Service Worker registered."
            );

          })
          .catch(function(error) {

            console.log(
              "Service Worker registration failed:",
              error
            );

          });

      }
    );

  }

</script>

</body>
</html>
